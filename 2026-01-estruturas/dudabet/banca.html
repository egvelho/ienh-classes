<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="input-nome" placeholder="Digite o seu nome" />
    <input
      type="text"
      id="input-aposta"
      placeholder="Digite uma aposta (0-16)"
    />
    <button id="btn-apostar">Apostar</button>
    <script>
      const inputNome = document.getElementById("input-nome");
      const inputAposta = document.getElementById("input-aposta");
      const btnApostar = document.getElementById("btn-apostar");

      btnApostar.onclick = async () => {
        const nome = inputNome.value;
        const aposta = Number(inputAposta.value);

        if (aposta > 16 || aposta < 0) {
          alert("A aposta precisa ser um número entre 0 e 16");
          return;
        }

        const json = {
          nome,
          aposta,
        };

        const response = await fetch("/aposta", {
          method: "POST",
          body: JSON.stringify(json),
          headers: {
            "Content-Type": "application/json",
          },
        });
      };
    </script>
  </body>
</html>
