    <script>
      // + - * /
      //let resultado = (3 + 5) * 2;
      //console.log(resultado);

      /* 
     --- PARTE 1: ENTRADA DE DADOS E CONVERSÃO ---
     O prompt() sempre recebe o que o usuário digita como TEXTO (string).
     O comando Number() é essencial para transformar esse texto em NÚMERO real.
     Sem ele, o sinal de + apenas grudaria os textos (ex: "5" + "2" viraria "52").
    */
      let numA = Number(prompt("Digite o primeiro número"));
      let numB = Number(prompt("Digite o segundo número"));

      /* 
     --- PARTE 2: PROCESSAMENTO (CÁLCULOS) ---
     Aqui criamos variáveis para guardar o resultado de cada operação matemática.
     O JavaScript segue a ordem padrão da aritmética.
  */
      let resultadoSoma = numA + numB;
      let resultadoSubtracao = numA - numB;
      let resultadoMultiplicacao = numA * numB;
      let resultadoDivisao = numA / numB;

      /* 
     --- PARTE 3: FORMATAÇÃO DA RESPOSTA ---
     A variável 'mensagem' está usando a técnica de CONCATENAÇÃO (unir textos com variáveis).
     O símbolo + aqui serve para "colar" as frases nos resultados.
     O código "\n" é um comando especial que significa "Quebra de Linha" (New Line).
    */
      let mensagem =
        "Soma: " +
        resultadoSoma +
        "\n" +
        "Subtração: " +
        resultadoSubtracao +
        "\n" +
        "Multiplicação: " +
        resultadoMultiplicacao +
        "\n" +
        "Divisão: " +
        resultadoDivisao;

      /* 
     --- PARTE 4: SAÍDA (EXIBIÇÃO) ---
     alert: Mostra a mensagem em uma caixa de diálogo para o usuário.
     console.log: Envia a mesma mensagem para o "diário de bordo" do navegador (F12).
    */
      alert(mensagem);
      console.log(mensagem);

      /*
     DICA PARA OS ALUNOS:
     Note que as variáveis (ex: numA, resultadoSoma) não usam aspas. 
     Tudo o que estiver entre "aspas" é texto puro (String), 
     o que está sem aspas o JavaScript tenta interpretar como um valor ou comando.
    */
